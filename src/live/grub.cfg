set default=0
set timeout=3
set gfxpayload=keep
insmod all_video
menuentry "LLM OS (run from this medium)" {
    linux /boot/vmlinuz @@CMDLINE@@
    initrd /boot/initramfs-live
}
menuentry "LLM OS (serial console)" {
    linux /boot/vmlinuz @@CMDLINE@@ console=ttyS0,115200
    initrd /boot/initramfs-live
}
