<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM OS Setup</title>
<style>
:root {
  --bg: #f5f5f7; --surface: #ffffff; --text: #1c1c1e; --muted: #6c6c73; --line: #e3e3e8; --hover: #fafafc;
  --accent: #6b4fd8; --accent-ink: #ffffff; --accent-weak: #efeaff; --ok: #1f8a3b; --ok-weak: #e7f6eb;
  --danger: #d1182b; --danger-btn: #d1182b; --danger-weak: #fdecee; --warn: #8a5a00;
  --shadow: 0 1px 2px rgba(20, 20, 30, .05), 0 6px 20px rgba(20, 20, 30, .06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --surface: #1b1b1f; --text: #f2f2f6; --muted: #9a9aa3; --line: #2c2c33; --hover: #222228;
    --accent: #9b86ff; --accent-ink: #14111f; --accent-weak: #262040; --ok: #3ccf6a; --ok-weak: #15301d;
    --danger: #ff6b74; --danger-btn: #d2303c; --danger-weak: #3a1a1e; --warn: #e3b341;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.page { max-width: 600px; margin: 0 auto; padding: 32px 22px 28px; min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 44px; }
.orb { width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 34% 30%, #e2d9ff 0, #9b86ff 42%, #5338b8 100%); box-shadow: 0 0 0 5px var(--accent-weak); }
.brand { font-weight: 650; font-size: 17px; letter-spacing: -.01em; }
.ver { margin-left: auto; color: var(--muted); font-size: 13px; }
main { flex: 1; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.022em; margin: 0 0 8px; font-weight: 700; }
.lead { color: var(--muted); font-size: 17px; margin: 0 0 26px; }
.note { color: var(--muted); font-size: 15px; margin: -12px 0 22px; }
.stack { display: grid; gap: 12px; }
.choice { display: flex; align-items: center; gap: 16px; width: 100%; padding: 20px; text-align: left; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); cursor: pointer;
  transition: border-color .15s, transform .15s; }
.choice:hover { border-color: var(--accent); transform: translateY(-1px); }
.choice .t { display: block; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.choice .d { display: block; color: var(--muted); font-size: 15px; margin-top: 1px; }
.icon { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-weak); color: var(--accent); }
.icon svg { width: 24px; height: 24px; }
.chev { margin-left: auto; color: var(--muted); flex: none; }
.chev svg { width: 20px; height: 20px; display: block; }
.back { display: inline-flex; align-items: center; gap: 4px; margin: -14px 0 18px -6px; padding: 6px 8px; border: 0; border-radius: 8px;
  background: none; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
.back:hover { color: var(--text); background: var(--surface); }
.back svg { width: 18px; height: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; }
.card-h { padding: 12px 14px 8px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
.card-h small { color: var(--muted); font-weight: 400; font-size: 14px; }
.drive { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid transparent; border-radius: 11px;
  background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.drive:hover:not(:disabled) { background: var(--hover); }
.drive[aria-checked="true"] { border-color: var(--accent); background: var(--accent-weak); }
.drive:disabled { cursor: default; opacity: .55; }
.radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.drive[aria-checked="true"] .radio { border-color: var(--accent); }
.drive[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.drive .n { font-weight: 600; }
.drive .m { color: var(--muted); font-size: 14px; }
.badge { margin-left: auto; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--danger-weak); color: var(--danger); white-space: nowrap; }
.empty { display: flex; align-items: center; gap: 12px; padding: 16px 14px 18px; color: var(--muted); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.actions { margin-top: 20px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 12px;
  font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.danger { background: var(--danger-btn); border-color: var(--danger-btn); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 14.5px; border-radius: 10px; }
.fine { color: var(--muted); font-size: 14px; text-align: center; margin: 0; }
.banner { padding: 12px 14px; border-radius: 12px; margin: 0 0 18px; font-size: 15px; background: var(--surface); border: 1px solid var(--line); }
.banner.bad { background: var(--danger-weak); border-color: transparent; color: var(--danger); }
.progress { padding: 22px 20px 20px; }
.ptitle { font-weight: 650; font-size: 17px; margin-bottom: 14px; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .5s ease; }
.bar.wait i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.pmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 21px; }
.hero { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 4px 0 20px; }
.hero svg { width: 34px; height: 34px; }
.hero.ok { background: var(--ok-weak); color: var(--ok); }
.hero.bad { background: var(--danger-weak); color: var(--danger); }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 2px; }
ol.steps > li { counter-increment: s; position: relative; padding: 14px 14px 14px 52px; }
ol.steps > li::before { content: counter(s); position: absolute; left: 14px; top: 13px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--accent-weak); color: var(--accent); }
ol.steps .sub { display: block; margin-top: 8px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.key { font-size: 13.5px; padding: 3px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.key b { font-weight: 650; }
kbd { font: inherit; font-weight: 650; }
.ok-line { color: var(--ok); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
details { margin-top: 18px; color: var(--muted); font-size: 15px; }
summary { cursor: pointer; color: var(--text); font-weight: 600; }
details p { margin: 8px 0 0; }
footer { display: flex; align-items: center; gap: 12px; margin-top: 36px; color: var(--muted); font-size: 13.5px; }
footer .btn { margin-left: auto; }
.modal { position: fixed; inset: 0; background: rgba(10, 10, 15, .45); display: grid; place-items: center; padding: 20px; z-index: 10; }
.dialog { width: 100%; max-width: 420px; background: var(--surface); border-radius: 18px; padding: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.dialog h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.01em; }
.dialog p { margin: 0 0 8px; color: var(--muted); }
.dialog .warn { color: var(--danger); font-weight: 600; }
.row { display: flex; gap: 10px; margin-top: 18px; }
.row .btn { flex: 1; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 480px) { h1 { font-size: 26px; } .page { padding-top: 22px; } header { margin-bottom: 32px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 0s !important; } .spin { animation: none; } }
</style>
</head>
<body>
<div class="page">
  <header><div class="orb" aria-hidden="true"></div><div class="brand">LLM OS</div><div class="ver" id="ver"></div></header>
  <main id="app" aria-live="polite"></main>
  <footer><span id="this"></span><button class="btn small" data-act="quit">Quit</button></footer>
</div>
<div id="modal"></div>
<script>
const TOKEN = decodeURIComponent(location.hash.slice(1));
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gb = (n) => (n >= 10e9 ? Math.round(n / 1e9) : (n / 1e9).toFixed(1)) + " GB";
const svg = (d, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  usb: svg('<rect x="6.5" y="9.5" width="11" height="12" rx="2.5"/><path d="M8.5 9.5V3.5h7v6"/><path d="M10.6 6h.01M13.4 6h.01"/>'),
  win: svg('<rect x="3" y="4" width="18" height="13.5" rx="2"/><path d="M3 8h18M8.5 21h7M12 17.5V21"/>'),
  chev: svg('<path d="M9 6l6 6-6 6"/>', 2.2), back: svg('<path d="M15 6l-6 6 6 6"/>', 2.2),
  ok: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.6), bad: svg('<path d="M12 6.5v7M12 17.5v.01"/>', 2.8),
};
let S = { st: null, view: "home", drives: [], derr: "", pick: "", notice: "", busy: false, samples: [], down: false, timer: null, launched: false };

async function api(path, body) {
  const o = { headers: { "X-LLMOS-Token": TOKEN }, cache: "no-store" };
  if (body !== undefined) { o.method = "POST"; o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
  try {
    const r = await fetch(path, o);
    if (!r.ok) throw new Error(r.status);
    S.down = false;
    return await r.json();
  } catch (e) {
    if (!S.down) { S.down = true; closed("Setup isn't running any more.", "Start it again with Start Here in the LLM OS folder."); }
    throw e;
  }
}

const OS = () => (S.st && S.st.host.os) || "mac";
const thisName = () => ({ mac: "Mac", windows: "PC" }[OS()] || "computer");

function show(view) {
  S.view = view; clearInterval(S.timer); S.timer = null;
  render();
  if (view === "usb") { pollDrives(); S.timer = setInterval(pollDrives, OS() === "windows" ? 3000 : 2000); }
  if (view === "write") { pollJob(); S.timer = setInterval(pollJob, 600); }
  window.scrollTo(0, 0);
  const h = document.querySelector("main h1"); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
}

function render() {
  const v = { home, usb, write, done, error, tryit }[S.view] || home;
  $("app").innerHTML = v();
}

function home() {
  return `<h1>Set up LLM OS</h1><p class="lead">What would you like to do?</p>
  <div class="stack">
    <button class="choice" data-go="usb"><span class="icon">${I.usb}</span><span><span class="t">Make a USB stick</span>
      <span class="d">Start or install LLM OS on a PC or Intel Mac.</span></span><span class="chev">${I.chev}</span></button>
    <button class="choice" data-go="tryit"><span class="icon">${I.win}</span><span><span class="t">Try it in a window</span>
      <span class="d">Run LLM OS on this ${thisName()} without changing anything.</span></span><span class="chev">${I.chev}</span></button>
  </div>`;
}

function usb() {
  const h = S.st.host, img = S.st.usb.state;
  const broken = img === "bad" || img === "missing";
  return `<button class="back" data-go="home">${I.back}Back</button>
  <h1>Make a USB stick</h1>
  <p class="lead">For PCs (Dell, HP, Lenovo and others) and Intel Macs.</p>
  ${h.boots_usb ? "" : `<p class="note">This ${thisName()} can't start from a USB stick, so use the stick on another computer.</p>`}
  ${S.notice ? `<div class="banner">${esc(S.notice)}</div>` : ""}
  ${broken ? `<div class="banner bad">${img === "missing" ? "This copy of LLM OS is missing its USB image." : "This copy of LLM OS is damaged."}
     Get a fresh copy of the LLM OS folder, then try again.</div>` : ""}
  <div class="card"><div class="card-h">Plug in a USB stick <small>8 GB or larger</small></div><div id="drives">${drivesHTML()}</div></div>
  <div class="actions">
    <button class="btn danger" id="go" data-act="erase" ${canWrite() && !broken ? "" : "disabled"}>Erase and write</button>
    <p class="fine">Everything on the stick will be erased.</p>
  </div>`;
}

function drivesHTML() {
  if (S.derr && !S.drives.length) return `<div class="empty">${esc(S.derr)}</div>`;
  if (!S.drives.length) return `<div class="empty"><span class="spin" aria-hidden="true"></span>Waiting for a USB stick…</div>`;
  return `<div role="radiogroup" aria-label="USB sticks">` + S.drives.map((d) => {
    const meta = [gb(d.size)].concat((d.labels || []).map((l) => `“${l}”`)).join(" · ");
    const badge = d.too_small ? `<span class="badge">Too small</span>` : d.large ? `<span class="badge">Large drive</span>` : "";
    return `<button class="drive" role="radio" aria-checked="${S.pick === d.id}" data-pick="${esc(d.id)}" ${d.too_small ? "disabled" : ""}>
      <span class="radio" aria-hidden="true"></span><span><span class="n">${esc(d.name)}</span><br><span class="m">${esc(meta)}</span></span>${badge}</button>`;
  }).join("") + `</div>`;
}

const picked = () => S.drives.find((d) => d.id === S.pick);
const canWrite = () => !!picked() && !picked().too_small;

async function pollDrives() {
  if (S.view !== "usb") return;
  let r; try { r = await api("/api/drives"); } catch (e) { return; }
  const before = JSON.stringify([S.drives, S.derr]);
  S.drives = r.drives || []; S.derr = r.error || "";
  if (S.pick && !picked()) S.pick = "";
  if (!S.pick) { const usable = S.drives.filter((d) => !d.too_small && !d.large); if (usable.length === 1) S.pick = usable[0].id; }
  if (JSON.stringify([S.drives, S.derr]) !== before && $("drives")) { $("drives").innerHTML = drivesHTML(); syncGo(); }
}
function syncGo() { const b = $("go"); const broken = ["bad", "missing"].includes(S.st.usb.state); if (b) b.disabled = !canWrite() || broken; }

function confirmErase() {
  const d = picked(); if (!d) return;
  $("modal").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="dialog">
    <h2 id="dt">Erase “${esc(d.name)}”?</h2>
    <p>Everything on this ${gb(d.size)} drive will be deleted.</p>
    ${d.large ? `<p class="warn">That's bigger than most USB sticks. Make sure it's the right drive.</p>` : ""}
    <div class="row"><button class="btn" data-act="cancel" id="cancel">Cancel</button><button class="btn danger" data-act="write">Erase and write</button></div>
  </div></div>`;
  $("cancel").focus();
}
const closeModal = () => { $("modal").innerHTML = ""; };

async function startWrite() {
  const d = picked(); closeModal(); if (!d) return;
  let r; try { r = await api("/api/write", { drive: d.id }); } catch (e) { return; }
  if (!r.ok) { S.notice = r.error; render(); return; }
  S.notice = ""; S.samples = []; S.job = { drive: d, phase: "checking", done: 0, total: 0 };
  show("write");
}

const PHASE = {
  checking: ["Getting ready", "Checking the LLM OS image…"],
  preparing: ["Getting ready", "Preparing the stick…"],
  password: null,
  writing: ["Writing LLM OS", ""],
  verifying: ["Checking the stick", ""],
  finishing: ["Almost done", "Ejecting the stick…"],
};
function passwordText() {
  return { mac: ["Enter your Mac password", "macOS asks before anything is written."],
           windows: ["Click Yes", "Windows asks before anything is written."] }[OS()] || ["Enter your password", "Linux asks before anything is written."];
}
function write() {
  const d = S.job.drive;
  return `<h1 id="ph">Getting ready</h1><p class="lead">${esc(d.name)} · ${gb(d.size)}</p>
  <div class="card progress"><div class="ptitle" id="pt">Checking the LLM OS image…</div>
    <div class="bar wait" id="bar"><i id="fill"></i></div><div class="pmeta"><span id="pct"></span><span id="eta"></span></div></div>
  <p class="fine" style="margin-top:16px">Keep the stick plugged in.</p>`;
}

function eta(done, total, phase) {
  const now = performance.now();
  S.samples = S.samples.filter((s) => s.phase === phase && now - s.t < 10000);
  S.samples.push({ t: now, done, phase });
  if (S.samples.length < 3) return "";
  const a = S.samples[0], b = S.samples[S.samples.length - 1];
  const rate = (b.done - a.done) / ((b.t - a.t) / 1000);
  if (rate <= 0) return "";
  const left = (total - done) / rate;
  return left < 60 ? "Less than a minute left" : `About ${Math.round(left / 60)} min left`;
}

async function pollJob() {
  if (S.view !== "write") return;
  let p; try { p = await api("/api/progress"); } catch (e) { return; }
  if (p.phase === "done") { show("done"); return; }
  if (p.phase === "error") { S.job.error = p.error; show("error"); return; }
  if (p.phase === "cancelled") { S.notice = "Cancelled. Nothing was written."; show("usb"); return; }
  const [title, sub] = p.phase === "password" ? passwordText() : (PHASE[p.phase] || PHASE.checking);
  const measured = ["writing", "verifying", "checking"].includes(p.phase) && p.total > 0;
  const pct = measured ? Math.min(100, Math.floor((p.done * 100) / p.total)) : 0;
  $("ph").textContent = title;
  $("pt").textContent = sub || (p.phase === "writing" ? "Copying LLM OS onto the stick…" : "Reading it back to make sure it's right…");
  $("bar").classList.toggle("wait", !measured);
  $("fill").style.width = measured ? pct + "%" : "";
  $("pct").textContent = measured ? pct + "%" : "";
  $("eta").textContent = measured && p.phase !== "checking" ? eta(p.done, p.total, p.phase) : "";
}

function done() {
  const win = OS() === "windows";
  return `<div class="hero ok">${I.ok}</div><h1>Your USB stick is ready</h1>
  <p class="lead">${S.st.host.boots_usb ? "Use it on this computer or another one." : "Use it on a PC or an Intel Mac."}</p>
  <div class="card"><ol class="steps">
    <li>Plug the stick into the computer.</li>
    <li>Turn it on and press its boot-menu key right away, then choose the USB stick.
      <span class="keys">${[["Dell", "F12"], ["HP", "F9"], ["Lenovo", "F12"], ["ASUS", "F8"], ["Acer", "F12"], ["MSI", "F11"], ["Surface", "hold Volume −"], ["Intel Mac", "hold Option"]]
        .map(([m, k]) => `<span class="key">${m} <b>${k}</b></span>`).join("")}</span></li>
    <li>LLM OS starts. To keep it on that computer, say <b>“install LLM OS”</b>.</li>
  </ol></div>
  ${win ? `<p class="fine" style="margin-top:14px">If Windows offers to format the stick, click Cancel.</p>` : ""}
  <details><summary>It doesn't start from the stick?</summary>
    <p>In the boot menu, choose the entry that names the stick or says USB or UEFI. Secure Boot can stay on.</p>
    <p>A few newer laptops (Microsoft Surface, some Lenovo) trust only Windows at first. In their settings (Surface: hold Volume + while starting), allow the “Microsoft and third-party” certificates under Secure Boot, then try again.</p>
  </details>
  <div class="actions"><button class="btn primary" data-go="home">Done</button></div>`;
}

function error() {
  return `<div class="hero bad">${I.bad}</div><h1>The stick wasn't written</h1>
  <p class="lead">${esc(S.job && S.job.error)}</p>
  <div class="actions"><button class="btn primary" data-go="usb">Try again</button></div>`;
}

function tryit() {
  const v = S.st.vm, h = S.st.host;
  const mem = v.low_memory ? `<p class="note">This ${thisName()} has ${h.ram_gb} GB of memory. LLM OS needs 4 GB of it, so close other apps first.</p>` : "";
  const head = `<button class="back" data-go="home">${I.back}Back</button><h1>Try it in a window</h1>`;
  if (v.method === "launcher") {
    return `${head}<p class="lead">LLM OS opens in its own window on this Mac.</p>${mem}
    <div class="actions"><button class="btn primary" data-act="start">Start LLM OS</button>
    ${S.launched ? `<p class="fine">Starting… its window opens in a moment.</p>` : ""}</div>`;
  }
  if (v.method === "none") {
    return `${head}<p class="lead">This ${thisName()} can't run LLM OS in a window. Make a USB stick and use it on a PC instead.</p>
    <div class="actions"><button class="btn primary" data-go="usb">Make a USB stick</button></div>`;
  }
  const app = { utm: "UTM", virtualbox: "VirtualBox", boxes: "Boxes" }[v.method];
  const get = v.installed ? `<span class="sub"><span class="ok-line">${svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.6).replace("<svg", '<svg width="16" height="16"')} ${app} is installed</span>
      <button class="btn small" data-act="open-app">Open ${app}</button></span>`
    : `<span class="sub"><button class="btn small primary" data-act="get-app">Download ${app}</button></span>`;
  const file = `<span class="sub"><button class="btn small" data-act="image">Show the LLM OS file</button></span>`;
  const steps = {
    utm: [`Get ${app}, the free app that runs it.${get}`,
          `In UTM, click <kbd>+</kbd>, then <b>Virtualize</b> › <b>Linux</b>.`,
          `For <b>Boot ISO Image</b>, click Browse and choose the LLM OS file.${file}`,
          `Click Continue until <b>Save</b>, then press <b>▶</b>.`],
    virtualbox: [`Get ${app}, the free app that runs it.${get}`,
          `In VirtualBox, click <b>New</b>. For <b>ISO Image</b>, choose the LLM OS file.${file}`,
          `Set <b>Base Memory</b> to 4096 MB.`,
          `Click Next until <b>Finish</b>, then <b>Start</b>.`],
    boxes: [`Get ${app}, the free app that runs it.${get}`,
          `In Boxes, click <b>+</b> › <b>Install from File</b> and choose the LLM OS file.${file}`,
          `Give it 4 GB of memory, then click <b>Create</b>.`],
  }[v.method];
  return `${head}<p class="lead">LLM OS runs inside the free app ${app}.</p>${mem}
  <div class="card"><ol class="steps">${steps.map((s) => `<li>${s}</li>`).join("")}</ol></div>`;
}

function closed(title, sub) {
  clearInterval(S.timer); closeModal();
  $("app").innerHTML = `<h1>${esc(title)}</h1><p class="lead">${esc(sub)}</p>`;
  document.querySelector("footer").style.visibility = "hidden";
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-go],[data-act],[data-pick]"); if (!el || el.disabled) return;
  if (el.dataset.go) { if (el.dataset.go !== "usb") S.notice = ""; show(el.dataset.go); return; }
  if (el.dataset.pick !== undefined) { S.pick = el.dataset.pick; $("drives").innerHTML = drivesHTML(); syncGo();
    const again = document.querySelector(`[data-pick="${CSS.escape(S.pick)}"]`); if (again) again.focus(); return; }
  const a = el.dataset.act;
  if (a === "erase") confirmErase();
  else if (a === "cancel") closeModal();
  else if (a === "write") startWrite();
  else if (a === "quit") { try { await api("/api/quit", {}); } catch (x) {} S.down = true; closed("Setup is closed", "You can close this tab."); }
  else { let r; try { r = await api("/api/open", { what: a }); } catch (x) { return; }
         if (a === "start" && r.ok) { S.launched = true; render(); }
         else if (!r.ok && r.error) alert(r.error); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("modal").innerHTML) closeModal(); });

(async function boot() {
  if (!TOKEN) { closed("Open LLM OS Setup from its Start Here file", "In the LLM OS folder, open Start Here for your computer."); return; }
  try { S.st = await api("/api/status"); } catch (e) { return; }
  const h = S.st.host;
  $("ver").textContent = S.st.version ? "Version " + S.st.version : "";
  $("this").textContent = ["This " + thisName(), h.chip, h.ram_gb ? h.ram_gb + " GB memory" : ""].filter(Boolean).join(" · ");
  show("home");
})();
</script>
