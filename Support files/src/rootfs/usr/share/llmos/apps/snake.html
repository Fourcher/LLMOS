<!-- llmos-app: id=snake; title=Snake; size=m; words=snake game arcade -->
<style>canvas{display:block;margin:6px auto;background:var(--card);border-radius:var(--r);max-width:100%}.st{display:flex;justify-content:space-between;color:var(--dim)}</style>
<div class="st"><span id="sc">Score 0</span><span id="hi"></span></div><canvas id="cv" width="400" height="400"></canvas><p class="st" style="justify-content:center">Arrow keys or WASD · Space to pause · Enter to restart</p>
<script>
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),N=20,S=20;let sn,dir,nd,food,score,hi=0,dead,pause,tick;
const cs=getComputedStyle(document.documentElement),AC=cs.getPropertyValue("--accent").trim()||"#7c5cff",FG=cs.getPropertyValue("--fg").trim()||"#fff";
function place(){do food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)];while(sn.some(p=>p[0]===food[0]&&p[1]===food[1]))}
function reset(){sn=[[10,10],[9,10],[8,10]];dir=nd=[1,0];score=0;dead=false;pause=false;place();clearInterval(tick);tick=setInterval(step,110);draw()}
function step(){if(dead||pause)return;dir=nd;const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]===h[0]&&p[1]===h[1])){dead=true;if(score>hi){hi=score;LLMOS.save({hi})}draw();return}
 sn.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;place()}else sn.pop();draw()}
function draw(){cx.clearRect(0,0,400,400);cx.fillStyle=FG;cx.beginPath();cx.arc(food[0]*S+S/2,food[1]*S+S/2,S/2-3,0,7);cx.fill();sn.forEach((p,i)=>{cx.fillStyle=AC;cx.globalAlpha=1-i/(sn.length*1.6);cx.fillRect(p[0]*S+1,p[1]*S+1,S-2,S-2)});cx.globalAlpha=1;
 document.getElementById("sc").textContent="Score "+score;document.getElementById("hi").textContent="Best "+hi;if(dead||pause){cx.fillStyle="rgba(0,0,0,.5)";cx.fillRect(0,0,400,400);cx.fillStyle="#fff";cx.font="bold 26px sans-serif";cx.textAlign="center";cx.fillText(dead?"Game over · Enter":"Paused",200,205)}}
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
 if(m&&!(m[0]===-dir[0]&&m[1]===-dir[1])){nd=m;e.preventDefault()}if(k===" "){pause=!pause;draw();e.preventDefault()}if(k==="enter")reset()});
LLMOS.load(s=>{hi=(s&&s.hi)||0;reset()});
</script>
