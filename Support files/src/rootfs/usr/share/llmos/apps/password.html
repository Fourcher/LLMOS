<!-- llmos-app: id=password; title=Password maker; size=s; words=password passwords passphrase -->
<style>
.out{background:var(--card);border-radius:var(--r);padding:16px;font-family:var(--mono);font-size:22px;word-break:break-all;min-height:64px;margin-bottom:12px}
label{display:flex;align-items:center;gap:8px;margin:6px 0}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
</style>
<div class="out" id="o"></div>
<label>Length <input type="range" id="n" min="8" max="64" value="20"> <b id="nv"></b></label>
<label><input type="checkbox" id="up" checked> Capital letters</label><label><input type="checkbox" id="di" checked> Numbers</label><label><input type="checkbox" id="sy" checked> Symbols</label><label><input type="checkbox" id="wd"> Words instead (easier to type)</label>
<div class="row"><button class="primary" id="g">New</button><button id="c">Copy</button></div>
<script>
const $=id=>document.getElementById(id);const W="apple river stone candle orbit maple tiger velvet copper lantern meadow pixel quartz harbor ember falcon willow cobalt sunset glacier".split(" ");
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function gen(){$("nv").textContent=$("n").value;if($("wd").checked){const k=Math.max(3,Math.round($("n").value/6));$("o").textContent=Array.from({length:k},()=>W[rnd(W.length)]).join("-")+($("di").checked?"-"+rnd(100):"");return}
 let s="abcdefghijkmnopqrstuvwxyz";if($("up").checked)s+="ABCDEFGHJKLMNPQRSTUVWXYZ";if($("di").checked)s+="23456789";if($("sy").checked)s+="!@#$%^&*-_=+?";$("o").textContent=Array.from({length:+$("n").value},()=>s[rnd(s.length)]).join("")}
["n","up","di","sy","wd"].forEach(i=>$(i).oninput=gen);$("g").onclick=gen;$("c").onclick=()=>{const r=document.createRange();r.selectNodeContents($("o"));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand("copy");$("c").textContent="Copied";setTimeout(()=>$("c").textContent="Copy",1200)};gen();
</script>
